# ─── Étape 1 : HTTP uniquement (pour que Certbot puisse générer le certificat)
# Remplace TON_DOMAINE par ton vrai domaine ou IP partout dans ce fichier.

server {
    listen 80;
    server_name TON_DOMAINE;

    # Challenge ACME — ne pas toucher
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirige tout le reste vers HTTPS une fois le certificat obtenu
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Étape 2 : HTTPS (activer après "docker compose run certbot certonly")
server {
    listen 443 ssl;
    server_name TON_DOMAINE;

    ssl_certificate     /etc/letsencrypt/live/TON_DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TON_DOMAINE/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── API Backend ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend Vue.js ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
