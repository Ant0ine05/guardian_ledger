services:

  backend:
    build: ./src/backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"
    networks:
      - app_network

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  sqlite_data:
  certbot_conf:
  certbot_www:

networks:
  app_network:
    driver: bridge
